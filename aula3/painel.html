<pre 
    id = "idLogUser">

</pre>

<h2>

    Cadastro

</h2>

<p>

    Preencha os campos abaixo

</p>

<form 
    id = "idFormRegister">

    Nome:
        <input 
            id = "idRegName" 
            type = "text" 
            placeholder = "Digite seu nome completo" />

    <br>

    Email:
        <input 
            id = "idRegEmail" 
            type = "email" 
            placeholder = "Digite o seu melhor email" />
    <br>

    Senha:
        <input 
            id = "idRegPassword" 
            type = "password" 
            placeholder = "Letra maiúscula e números" />
    <br>

    Data de nascimento:
        <input 
            id = "idRegDate" 
            type = "date" />

    <br><br>

    <button
        type = "submit">

        Cadastrar

    </button>

</form>

<br><br><br><br>

    src = "user.js">

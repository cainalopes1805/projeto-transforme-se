<body class="bg-primary h-full">

    <head>

        <title>

            Aula 6

        </title>

        <link rel="stylesheet" href="style.css">

    </head>

    <section>

        <div class="flex fixed top-0 right-0 bottom-0 left-0 items-center justify-center">

            <div class="relative max-w-md w-full p-5 bg-white rounded-lg shadow-md flex column">

                <h3 href="index.html"
                    class="mb-0 bg-terciary absolute top-0 text-white rounded-full px-3 py-2 fs-8 right-0 mr-3 hover:text-dark hover:bg-white cursor-pointer">

                    Voltar

                </h3>

                <div>

                    <form>

                        <h1 class="text-center mt-0 text-dark">

                            Login

                        </h1>

                        <p class="text-center text-dark">

                            Preencha os campos abaixo

                        </p>

                        <table class="p-4 bg-terciary rounded-lg mx-auto text-white shadow-md">
                            <tr>
                                <td>Email:</td>
                                <td><input id="idLogEmail" type="email" placeholder="Digite o email cadastrado"
                                        class="rounded-xl py-3 px-6 hover:bg-secondary"
                                        style="border-width: 1; border-style: solid;" />
                                </td>
                            </tr>
                            <tr>
                                <td>Senha:</td>
                                <td><input id="idLogPassword" type="password" placeholder="Digite sua senha"
                                        class="rounded-xl py-3 px-6 hover:bg-secondary"
                                        style="border-width: 1; border-style: solid;" />
                                </td>
                            </tr>
                            <tr>
                                <td class="pt-4" colspan="2">
                                    <a id="idFormLogin"
                                        class="flex justify-center text-center bg-primary py-3 text-white rounded-full shadow-md hover:bg-white hover:text-dark cursor-pointer">

                                        Entrar

                                    </a>
                                </td>
                            </tr>
                        </table>
                    </form>
                </div>
            </div>
        </div>
        <pre id="idResponse" class="mt-5 mb-0 text-center">

        </pre>
    </section>
</body>


<script src="user.js">

</script>

<body
    class = "bg-primary">

        <head>
            
            <title>
                
                Aula 6

            </title>

            <link
                rel = "stylesheet"

        </head>

        <section>

                            <form 
                                class = "rounded-xl bg-white shadow text-center mb-0 py-5">

                                            Voltar
                                        
                                        </a>


                                    <div>

                                            class = "mx-auto my-0"
                                            style = "font-size: 60;">

                                                Login

                                        </h1>

                                    </div>

                                    <table class = "mx-auto mb-5">

                                        <tr>

                                            <article
                                                style="font-size: 30;"
                                            >

                                                <div 
                                                    class = "flex items-center mx-6 gap-2"
                                                >

                                                        <div> 
                                                            Email
                                                        </div>

                                                    </td>

                                                    <td>

                                                        <input 
                                                            id = "idLogEmail"

                                                        />

                                                    </td>

                                                </div>
                                            </article>

                                        </tr>

                                        <tr>

                                     <article
                                   
                                        style="font-size: 30;"
                                    >
                                        <div 
                                            class = "flex items-center mx-6 gap-2 mb-5"
                                        >         
                                        
                                            <td>

                                                <div> 
                                                    Senha
                                                </div>

                                            </td>

                                            <td>

                                                <input 
                                                    id = "idLogPassword" 
                                                    type = "password" 
                                                    placeholder = "Digite sua senha" 
                                                    class = "rounded-xl py-3 px-6 hover:bg-secondary"
                                                    style = "border-width: 1; border-style: solid;"
                                                />

                                            </td>

                                        </div>

                                    </article>

                                        </tr>

                                    </table>
                                
                                <a
                                    id = "idFormLogin"
                                    class = "px-7b text-center py-3 bg-primary rounded-full shadow-1 hover:bg-terciary hover:c-white mt-5">

                                        Entrar

                                </a>                              

                            </form>

                            <pre
                                id = "idResponse"

                            </pre>

                    </div>

</body>

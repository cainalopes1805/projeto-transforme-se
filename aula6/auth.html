<head>
    
    <title>
        
        Aula 5

    </title>
    
    <link 
        rel="preconnect" href="https://fonts.googleapis.com">

    <link 
        rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <link
        rel = "stylesheet"
        href = "style.css">

</head>

<body class = "bg-white">

    <div class = "text-center">
    
        <h2 class = "flex max-w-md mx-auto px-5 py-4 bg-terciary text-white text-center rounded-full mt-3 shadow-md column">
            
            <pre
                id = "idUsuario"
                class = "mt-0 mb-0 flex justify-center">

            </pre>

        </h2>

    </div>

    <div 
        id = "idModalRegister"
        class = "fixed top-0 right-0 bottom-0 left-0 hidden items-center justify-center bg-green-50 z-50">

        <div class = "relative max-w-md w-full p-5 bg-primary rounded-lg shadow-md flex column">

            <h3 
                id = "idClose"
                class = "mb-0 bg-secondary absolute top-0 text-dark rounded-full px-3 py-2 fs-8 right-0 mr-3 hover:text-white hover:bg-terciary">
                
                X
            
            </h3>

            <div>

                <form>

                    <h1 class = "text-center mt-0 text-dark">

                    Cadastro

                    </h1>

                    <p class = "text-center text-dark">

                        Preencha os campos abaixo

                    </p>                    

                    <table class = "pb-5 mx-auto text-dark">

                        <tr>

                            <td>Nome:</td>
                            
                            <td><input 
                                id = "idRegName" 
                                type = "text" 
                                placeholder = "Digite seu nome completo"
                                class = "rounded-xl pl-4 pr-6 py-3 hover:bg-secondary"
                                style = "border-width: 1; border-style: solid;"
                                required /></td>

                        </tr>
                        <tr>
                            
                            <td>Email:</td>
                            <td><input 
                                id = "idRegEmail" 
                                type = "email" 
                                placeholder = "Digite o seu melhor email"
                                class = "rounded-xl pl-4 pr-6 py-3 hover:bg-secondary"
                                style = "border-width: 1; border-style: solid;"
                                required /></td>

                        </tr>
                        <tr>
                            
                            <td>Senha:</td>
                            <td><input 
                                id = "idRegPassword" 
                                type = "password" 
                                placeholder = "Letra maiúscula e números"
                                class = "rounded-xl py-3 pl-4 pr-6 hover:bg-secondary"
                                style = "border-width: 1; border-style: solid"
                                required/></td>

                        </tr>
                        <tr class = "text-right">

                            <td>Data de nascimento:</td>
                            <td><input 
                                id = "idRegDate" 
                                type = "date"
                                class = "rounded-xl py-3 px-6 hover:bg-secondary"
                                style = "border-width: 1; border-style: solid;"
                                required /></td>

                        </tr>

                    </table>                             

                </form>
                <a 
                    id = "idFormRegister"
                    class = "flex justify-center text-center  py-3 bg-terciary text-white rounded-full shadow-1 hover:bg-white hover:text-dark mt-0">

                    Cadastrar

                </a> 

            </div>

        </div>

    </div>


    <a 
        id = "idAddUser"
        class = "rounded-full bg-primary hover:bg-terciary hover:c-white m-4 px-6 py-4 fs-12 fixed bottom-0 right-0">

        +

    </a>

</body>

<table>

    <thead>

        <th>Nome</th>
        <th>Email</th>
        <th>Senha</th>

    </thead>
    <tbody id = "idListUsers">



    </tbody>

</table>

<script
    src = "user.js">

</script>

<script
    src = "auth.js">

</script>

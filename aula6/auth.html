<head>
    
    <title>
        
        Aula 5

    </title>
    
    <link 
        rel="preconnect" href="https://fonts.googleapis.com">

    <link 
        rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <link
        rel = "stylesheet"
        href = "style.css">

</head>

<body class = "bg-darkBlue">

    
    <a 
        href = "login.html"
        class = "rounded-full bg-primary hover:bg-terciary hover:c-white m-4 px-4 py-3 fs-8 fixed top-0 left-0 shadow-md">
        
        Voltar
    
    </a>


    <div class = "text-center">
    
        <table class = "max-w-md mx-auto bg-primary text-center text-dark rounded-full py-3 px-5 mt-5 fs-12 shadow-md">
            <tr>
                <td
                    id = "idUsuario"
                    class = "mt-0 mb-0 flex justify-center">
                </td>
            </tr>
        </table>

        </h2>

    </div>

    <div 
        id = "idModalRegister"
        class = "fixed top-0 right-0 bottom-0 left-0 hidden items-center justify-center bg-green-50 z-50">

        <div class = "relative max-w-md w-full p-5 bg-primary rounded-lg shadow-md flex column">

            <h3 
                id = "idClose"
                class = "mb-0 bg-terciary absolute top-0 text-white rounded-full px-3 py-2 fs-8 right-0 mr-3 hover:text-dark hover:bg-white cursor-pointer">
                
                X
            
            </h3>

            <div>

                <form>

                    <h1 class = "text-center mt-0 text-dark">

                    Cadastro

                    </h1>

                    <p class = "text-center text-dark">

                        Preencha os campos abaixo

                    </p>                    

                    <table class = "p-4 bg-terciary rounded-lg mx-auto text-white shadow-md">

                        <tr>

                            <td>Nome:</td>
                            
                            <td><input 
                                id = "idRegName" 
                                type = "text" 
                                placeholder = "Digite seu nome completo"
                                class = "rounded-xl pl-4 pr-6 py-3 hover:bg-white bg-darkBlue text-primary"
                                style = "border-width: 0; border-style: solid;"
                                required /></td>

                        </tr>
                        <tr>
                            
                            <td>Email:</td>
                            <td><input 
                                id = "idRegEmail" 
                                type = "email" 
                                placeholder = "Digite o seu melhor email"
                                class = "rounded-xl pl-4 pr-6 py-3 hover:bg-white bg-darkBlue text-primary"
                                style = "border-width: 0; border-style: solid;"
                                required /></td>

                        </tr>
                        <tr>
                            
                            <td>Senha:</td>
                            <td><input 
                                id = "idRegPassword" 
                                type = "password" 
                                placeholder = "Letra maiúscula e números"
                                class = "rounded-xl py-3 pl-4 pr-6 hover:bg-white bg-darkBlue text-primary"
                                style = "border-width: 0; border-style: solid"
                                required/></td>

                        </tr>
                        <tr class = "text-right">

                            <td>Data de nascimento:</td>
                            <td><input 
                                id = "idRegDate" 
                                type = "date"
                                max="9999-12-31"
                                class = "rounded-xl py-3 px-6 hover:bg-white cursor-pointer bg-darkBlue text-primary"
                                style = "border-width: 0; border-style: solid;"
                                required /></td>

                        </tr>
                        <tr>
                            <td
                                class = "pt-4"
                                colspan = "2">
                                <a 
                                    id = "idFormRegister"
                                    class = "flex justify-center text-center bg-primary py-3 text-dark rounded-full shadow-md hover:bg-white hover:text-dark cursor-pointer">

                                    Cadastrar

                                </a>
                            </td> 
                        </tr>
                    </table>                             

                </form>
                

            </div>

        </div>

    </div>


    <a 
        id = "idAddUser"
        class = "rounded-full bg-primary hover:bg-terciary hover:text-white m-4 px-5 py-4 fs-12 fixed bottom-0 right-0 shadow-md cursor-pointer">

        +

    </a>

</body>

<table class = "mx-auto mt-6 bg-primary p-2 rounded-lg shadow-md">
    <thead class = "bg-primary text-dark">
        <tr>
        <td class = "px-4 py-2 rounded text-center">Nome</td>
        <td class = "px-4 py-2 rounded text-center">Email</td>
        <td class = "px-4 py-2 rounded text-center">Ações</td>
        </tr>
    </thead>
    <tbody id = "idListUsers">

    </tbody>
</table>

<script
    src = "user.js">

</script>

<script
    src = "auth.js">

</script>

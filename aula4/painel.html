<form 
    id = "idFormRegister">

    Nome:
        <input 
            id = "idRegName" 
            type = "text" 
            placeholder = "Digite seu nome completo" />

    <br>

    Email:
        <input 
            id = "idRegEmail" 
            type = "email" 
            placeholder = "Digite o seu melhor email" />
    <br>

    Senha:
        <input 
            id = "idRegPassword" 
            type = "password" 
            placeholder = "Letra maiúscula e números" />
    <br>

    Data de nascimento:
        <input 
            id = "idRegDate" 
            type = "date" />

    <br><br>

        type = "submit">
